[project]
name = "sweettv-recsys"
version = "0.1.0"
description = "Kaggle sweet.tv TV program recommender (MAP@5) research project"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn>=1.9.1",
    "implicit>=0.7.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artifacts/src/sweettv"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# uv-specific configuration (project-local .venv, lockfile)
